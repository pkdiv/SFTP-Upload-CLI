name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: uplift-linux
          - os: macos-latest
            binary: uplift-darwin
          - os: windows-latest
            binary: uplift-windows.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o ${{ matrix.binary }} ./cmd/uplift
        timeout-minutes: 10

      - name: Test
        run: go test ./...
        timeout-minutes: 10

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: uplift-${{ matrix.os }}
          path: ${{ matrix.binary }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          gh release create latest \
            --title "Latest build" \
            --notes "Automated build from commit ${{ github.sha }}." \
            dist/*

