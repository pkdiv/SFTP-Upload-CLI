name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: sftp-upload
          - os: macos-latest
            binary: sftp-upload
          - os: windows-latest
            binary: sftp-upload.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o ${{ matrix.binary }} ./cmd/sftp-upload

      - name: Test
        run: go test ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sftp-upload-${{ matrix.os }}
          path: ${{ matrix.binary }}
